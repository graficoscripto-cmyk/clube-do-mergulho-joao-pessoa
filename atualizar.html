<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atualizar tabela | Clube do Mergulho</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#041826">
<link rel="icon" type="image/png" sizes="48x48" href="/img/logo-clube-48.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Albert+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sup:#EAF8F5;--raso:#CDEEE9;--turq:#16B3AE;--turq-esc:#0B7F80;--azul:#0F5C70;--fundo:#072B40;--abismo:#041826;--sol:#FFD23F;--tinta:#062232;--tinta-2:#3C5866;--erro:#C0392B;--ok:#0B7F55}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--abismo)}
body{min-height:100svh;font-family:'Albert Sans',system-ui,sans-serif;color:var(--tinta);line-height:1.5;background:radial-gradient(120% 70% at 50% 0,#0F5C70 0,#072B40 45%,#041826 100%);display:grid;place-items:start center;padding:max(22px,env(safe-area-inset-top)) 16px 40px;overflow-x:hidden}
.box{width:100%;max-width:460px}
.topo{text-align:center;color:#fff;margin-bottom:18px}
.topo img{width:92px;height:92px;margin:0 auto 12px;border-radius:50%;box-shadow:0 14px 34px -12px rgba(0,0,0,.7)}
.topo h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.25rem;line-height:1.2}
.topo p{margin-top:6px;color:rgba(228,245,246,.78);font-size:.98rem}
.card{background:#fff;border-radius:26px;padding:22px 18px 20px;box-shadow:0 30px 60px -30px #000}
label.rot,.rot{display:block;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--azul);margin-bottom:8px}
.campo{margin-bottom:18px}
input[type=password],input[type=text]{width:100%;min-height:54px;padding:0 16px;border-radius:14px;border:2px solid #c8dde0;font:inherit;font-size:1.1rem;color:var(--tinta);background:#f6fbfb}
input:focus{outline:none;border-color:var(--turq)}
.lembrar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.92rem;color:var(--tinta-2)}
.lembrar input{width:22px;height:22px;accent-color:var(--turq-esc)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:999px;font:inherit;font-weight:800;font-size:1.05rem;border:0;cursor:pointer;transition:transform .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px}
.btn.esc{background:var(--azul);color:#fff}
.btn.pub{background:#25D366;color:#063B1F;margin-top:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.prev{display:none;margin:0 0 18px;border-radius:16px;overflow:hidden;background:var(--raso);border:1px solid #c8dde0}
.prev.on{display:block}
.prev img{width:100%;height:auto;display:block}
.prev small{display:block;padding:8px 12px;font-size:.82rem;color:var(--tinta-2)}
.msg{display:none;margin-top:16px;padding:14px 16px;border-radius:14px;font-weight:700;font-size:.98rem}
.msg.on{display:block}
.msg.ok{background:#E1F7EC;color:var(--ok)}
.msg.erro{background:#FDEBE8;color:var(--erro)}
.msg.info{background:#E6F4F6;color:var(--azul)}
.msg a{color:inherit;text-decoration:underline}
.passos{margin-top:18px;color:rgba(228,245,246,.8);font-size:.9rem;text-align:center}
.passos a{color:var(--sol)}
.barra{display:none;height:8px;border-radius:99px;background:#d6e9eb;overflow:hidden;margin-top:14px}
.barra.on{display:block}
.barra i{display:block;height:100%;width:40%;border-radius:99px;background:var(--turq);animation:vai 1.1s ease-in-out infinite}
@keyframes vai{0%{margin-left:-40%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.barra i{animation:none;width:100%}}
</style>
</head>
<body>
<main class="box">
  <div class="topo">
    <img src="img/logo-clube-256.png" alt="Clube do Mergulho João Pessoa" width="92" height="92">
    <h1>Atualizar a tabela da semana</h1>
    <p>Escolha a foto nova e publique. O site muda na hora.</p>
  </div>

  <form class="card" id="form" autocomplete="off" novalidate>
    <div class="campo">
      <label class="rot" for="pin">Senha (PIN)</label>
      <input type="password" id="pin" name="pin" autocomplete="current-password" inputmode="text" placeholder="Digite a senha">
      <label class="lembrar"><input type="checkbox" id="lembrar"> Lembrar neste celular</label>
    </div>

    <div class="campo">
      <span class="rot">Foto da tabela</span>
      <div class="prev" id="prev"><img id="prevImg" alt="Prévia da foto escolhida"><small id="prevInfo"></small></div>
      <input type="file" id="arq" accept="image/*" hidden>
      <button type="button" class="btn esc" id="escolher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg><span id="escolherTxt">Escolher foto da tabela</span></button>
    </div>

    <button type="submit" class="btn pub" id="publicar" disabled>Publicar</button>
    <div class="barra" id="barra" aria-hidden="true"><i></i></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>

  <p class="passos">1. Digite a senha · 2. Escolha a foto · 3. Toque em Publicar<br><a href="/">Ver o site</a></p>
</main>

<script>
(function(){
  var d=document, $=function(i){return d.getElementById(i)};
  var arq=$('arq'), pin=$('pin'), lembrar=$('lembrar'), pub=$('publicar'), msg=$('msg'), barra=$('barra');
  var blob=null, ocupado=false;

  try{var guardado=localStorage.getItem('cdm-pin');if(guardado){pin.value=guardado;lembrar.checked=true}}catch(e){}

  function mostrar(tipo,html){msg.className='msg on '+tipo;msg.innerHTML=html}
  function limpar(){msg.className='msg';msg.innerHTML=''}
  function atualizar(){pub.disabled=ocupado||!blob||!pin.value.trim()}
  pin.addEventListener('input',function(){limpar();atualizar()});
  $('escolher').addEventListener('click',function(){arq.click()});

  /* comprime no navegador: lado maior ~1800 px, JPEG ~0,85 (reduz a qualidade se passar de ~3,5 MB) */
  function carregar(file){
    if(window.createImageBitmap){
      return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return viaTag(file)});
    }
    return viaTag(file);
  }
  function viaTag(file){
    return new Promise(function(ok,no){
      var u=URL.createObjectURL(file), im=new Image();
      im.onload=function(){ok(im)}; im.onerror=function(){no(new Error('img'))}; im.src=u;
    });
  }
  function comprimir(file){
    return carregar(file).then(function(img){
      var w0=img.width||img.naturalWidth, h0=img.height||img.naturalHeight, maior=Math.max(w0,h0), k=Math.min(1,1800/maior);
      var w=Math.round(w0*k), h=Math.round(h0*k), c=d.createElement('canvas');
      c.width=w; c.height=h;
      var cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
      return new Promise(function(ok,no){
        var q=.85;
        (function tenta(){
          c.toBlob(function(b){
            if(!b)return no(new Error('canvas'));
            if(b.size>3.5*1024*1024&&q>.5){q-=.1;return tenta()}
            ok({blob:b,w:w,h:h});
          },'image/jpeg',q);
        })();
      });
    });
  }

  arq.addEventListener('change',function(){
    var f=arq.files&&arq.files[0]; limpar();
    if(!f)return;
    if(!/^image\//.test(f.type)){blob=null;atualizar();return mostrar('erro','Esse arquivo não é uma foto. Escolha uma imagem.')}
    $('escolherTxt').textContent='Preparando a foto…';
    comprimir(f).then(function(r){
      blob=r.blob;
      $('prevImg').src=URL.createObjectURL(blob);
      $('prevInfo').textContent=r.w+' × '+r.h+' px · '+(r.blob.size/1024/1024).toFixed(1).replace('.',',')+' MB';
      $('prev').classList.add('on');
      $('escolherTxt').textContent='Trocar a foto';
      atualizar();
    }).catch(function(){
      blob=null; atualizar();
      $('escolherTxt').textContent='Escolher foto da tabela';
      mostrar('erro','Não consegui abrir essa foto. Tente outra.');
    });
  });

  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    if(ocupado||!blob||!pin.value.trim())return;
    ocupado=true; atualizar(); barra.classList.add('on'); pub.textContent='Publicando…';
    mostrar('info','Enviando a foto. Aguarde alguns segundos.');
    var ctl=('AbortController' in window)?new AbortController():null, tmo=setTimeout(function(){ctl&&ctl.abort()},45000);
    fetch('/api/tabela',{method:'POST',headers:{'x-pin':pin.value.trim(),'content-type':'image/jpeg'},body:blob,signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {s:r.status,j:j}})})
    .then(function(r){
      if(r.s===200&&r.j.ok){
        try{if(lembrar.checked)localStorage.setItem('cdm-pin',pin.value.trim());else localStorage.removeItem('cdm-pin')}catch(e){}
        mostrar('ok','Pronto! A tabela nova já está no site. <a href="/#saidas">Ver no site</a>');
        return;
      }
      if(r.s===401)return mostrar('erro','Senha incorreta. Confira e tente de novo.');
      if(r.s===429)return mostrar('erro','Muitas tentativas. Espere '+(r.j.segundos||'um pouco')+' segundos e tente de novo.');
      if(r.s===413)return mostrar('erro','A foto ficou grande demais. Tente outra foto.');
      if(r.s===415)return mostrar('erro','Esse tipo de arquivo não funciona. Use uma foto (JPG, PNG ou WebP).');
      if(r.s===503)return mostrar('erro','O envio ainda não foi ativado. Avise quem cuida do site.');
      mostrar('erro','Não deu certo agora. Tente de novo em instantes.');
    })
    .catch(function(){mostrar('erro','Sem conexão ou demorou demais. Confira a internet e tente de novo.')})
    .then(function(){clearTimeout(tmo);ocupado=false;barra.classList.remove('on');pub.textContent='Publicar';atualizar()});
  });
})();
</script>
</body>
</html>
